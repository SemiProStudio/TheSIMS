<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Dune theme: sand grain. Fine warm speckle for the light Solarized
       ground — dark umber flecks at low alpha read as paper tooth / fine
       sand. Tiles seamlessly at 240px (stitchTiles). -->
  <filter id="s" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" seed="11"/>
    <feColorMatrix values="0 0 0 0 0.33  0 0 0 0 0.27  0 0 0 0 0.15  0 0 0 0.3 0"/>
  </filter>
  <rect width="240" height="240" filter="url(#s)"/>
</svg>
