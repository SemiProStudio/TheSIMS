<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Darkroom theme: film grain. Fractal noise through a matrix that keeps
       only a faint luminance speckle; tiles seamlessly at 240px. -->
  <filter id="g" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" seed="7"/>
    <feColorMatrix values="0 0 0 0 0.95  0 0 0 0 0.85  0 0 0 0 0.65  0 0 0 0.18 0"/>
  </filter>
  <rect width="240" height="240" filter="url(#g)"/>
</svg>
