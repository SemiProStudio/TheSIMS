<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 280 280">
  <!-- Cats theme tile: cartoon cat faces, a sitting cat, paw prints and a
       ball of yarn, all outlined so they read on the pink page. -->
  <defs>
    <style>
      .o { stroke: #3e2723; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
      .thin { stroke: #3e2723; stroke-width: 1.8; stroke-linecap: round; fill: none; }
      .eye { fill: #3e2723; }
      .nose { fill: #f48fb1; stroke: #3e2723; stroke-width: 1.5; }
      .inner { fill: #f8bbd0; }
    </style>
  </defs>

  <!-- Orange tabby face, top-left -->
  <g transform="translate(24 28)" opacity="0.95">
    <polygon class="o" points="6,30 10,-2 32,18" fill="#f4a261"/>
    <polygon class="o" points="70,30 66,-2 44,18" fill="#f4a261"/>
    <polygon class="inner" points="12,24 14,8 26,19"/>
    <polygon class="inner" points="64,24 62,8 50,19"/>
    <ellipse class="o" cx="38" cy="36" rx="34" ry="28" fill="#f4a261"/>
    <!-- tabby stripes -->
    <path class="thin" d="M30 12 q8 -6 16 0 M26 20 q12 -8 24 0"/>
    <circle class="eye" cx="25" cy="34" r="3.5"/>
    <circle class="eye" cx="51" cy="34" r="3.5"/>
    <circle cx="26" cy="33" r="1.2" fill="#fff"/>
    <circle cx="52" cy="33" r="1.2" fill="#fff"/>
    <polygon class="nose" points="34,44 42,44 38,49"/>
    <path class="thin" d="M38 49 v5 M38 54 q-5 4 -9 0 M38 54 q5 4 9 0"/>
    <path class="thin" d="M4 40 h18 M4 48 l18 -3 M72 40 h-18 M72 48 l-18 -3"/>
  </g>

  <!-- Grey cat face, right -->
  <g transform="translate(176 92)" opacity="0.95">
    <polygon class="o" points="4,26 6,-4 28,14" fill="#90a4ae"/>
    <polygon class="o" points="64,26 62,-4 40,14" fill="#90a4ae"/>
    <polygon class="inner" points="10,20 11,6 22,15"/>
    <polygon class="inner" points="58,20 57,6 46,15"/>
    <ellipse class="o" cx="34" cy="32" rx="31" ry="26" fill="#90a4ae"/>
    <ellipse class="o" cx="22" cy="30" rx="5" ry="6" fill="#7cb342"/>
    <ellipse class="o" cx="46" cy="30" rx="5" ry="6" fill="#7cb342"/>
    <ellipse class="eye" cx="22" cy="30" rx="1.8" ry="4.5"/>
    <ellipse class="eye" cx="46" cy="30" rx="1.8" ry="4.5"/>
    <polygon class="nose" points="30,40 38,40 34,45"/>
    <path class="thin" d="M34 45 v4 M34 49 q-4 4 -8 0 M34 49 q4 4 8 0"/>
    <path class="thin" d="M2 36 h16 M2 44 l16 -3 M66 36 h-16 M66 44 l-16 -3"/>
  </g>

  <!-- Sitting tuxedo cat, bottom-left -->
  <g transform="translate(30 160)" opacity="0.95">
    <path class="o" d="M40 98 q-30 -6 -30 -40 q0 -24 30 -30 q30 6 30 30 q0 34 -30 40 z" fill="#263238"/>
    <ellipse class="o" cx="40" cy="78" rx="14" ry="20" fill="#fafafa"/>
    <path class="o" d="M70 70 q22 10 18 30 q-4 14 -22 6" fill="none" stroke-width="7"/>
    <path d="M70 70 q22 10 18 30 q-4 14 -22 6" fill="none" stroke="#263238" stroke-width="3.5" stroke-linecap="round"/>
    <polygon class="o" points="16,26 20,0 40,18" fill="#263238"/>
    <polygon class="o" points="64,26 60,0 40,18" fill="#263238"/>
    <circle class="o" cx="40" cy="32" r="26" fill="#263238"/>
    <path d="M40 44 q-12 14 -2 18 q2 1 4 0 q10 -4 -2 -18 z" fill="#fafafa"/>
    <ellipse cx="30" cy="30" rx="4" ry="5" fill="#ffd54f"/>
    <ellipse cx="50" cy="30" rx="4" ry="5" fill="#ffd54f"/>
    <ellipse class="eye" cx="30" cy="30" rx="1.5" ry="4"/>
    <ellipse class="eye" cx="50" cy="30" rx="1.5" ry="4"/>
    <polygon class="nose" points="37,40 43,40 40,44"/>
    <path class="thin" d="M12 36 h14 M12 42 l14 -2 M68 36 h-14 M68 42 l-14 -2" stroke="#fafafa"/>
  </g>

  <!-- Yarn ball, bottom-right -->
  <g transform="translate(196 206)" opacity="0.95">
    <circle class="o" cx="26" cy="26" r="24" fill="#ec407a"/>
    <path class="thin" d="M6 18 q20 -10 40 0 M4 30 q22 12 44 0 M16 6 q10 20 20 40 M36 6 q-10 20 -20 40" stroke="#ad1457" stroke-width="2.5"/>
    <path class="thin" d="M48 34 q20 -4 24 18" stroke="#ad1457" stroke-width="2.5"/>
  </g>

  <!-- Paw prints -->
  <g fill="#ec407a" stroke="#3e2723" stroke-width="1.5" opacity="0.9">
    <g transform="translate(128 22) rotate(-20)">
      <ellipse cx="0" cy="8" rx="7" ry="6"/>
      <circle cx="-8" cy="-2" r="3"/><circle cx="-2.5" cy="-6" r="3"/><circle cx="3.5" cy="-6" r="3"/><circle cx="9" cy="-2" r="3"/>
    </g>
    <g transform="translate(150 54) rotate(-20)">
      <ellipse cx="0" cy="8" rx="7" ry="6"/>
      <circle cx="-8" cy="-2" r="3"/><circle cx="-2.5" cy="-6" r="3"/><circle cx="3.5" cy="-6" r="3"/><circle cx="9" cy="-2" r="3"/>
    </g>
    <g transform="translate(140 200) rotate(25)">
      <ellipse cx="0" cy="8" rx="7" ry="6"/>
      <circle cx="-8" cy="-2" r="3"/><circle cx="-2.5" cy="-6" r="3"/><circle cx="3.5" cy="-6" r="3"/><circle cx="9" cy="-2" r="3"/>
    </g>
    <g transform="translate(236 30) rotate(10)">
      <ellipse cx="0" cy="8" rx="7" ry="6"/>
      <circle cx="-8" cy="-2" r="3"/><circle cx="-2.5" cy="-6" r="3"/><circle cx="3.5" cy="-6" r="3"/><circle cx="9" cy="-2" r="3"/>
    </g>
  </g>
</svg>
