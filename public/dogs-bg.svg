<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 280 280">
  <!-- Dogs theme tile: cartoon dog faces, a bone, a tennis ball and paw
       prints, outlined so they read on the warm grey page. -->
  <defs>
    <style>
      .o { stroke: #4e342e; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
      .thin { stroke: #4e342e; stroke-width: 1.8; stroke-linecap: round; fill: none; }
      .eye { fill: #4e342e; }
      .nose { fill: #4e342e; }
    </style>
  </defs>

  <!-- Golden retriever, top-left -->
  <g transform="translate(20 22)" opacity="0.95">
    <ellipse class="o" cx="10" cy="44" rx="12" ry="26" fill="#e0a64b"/>
    <ellipse class="o" cx="74" cy="44" rx="12" ry="26" fill="#e0a64b"/>
    <ellipse class="o" cx="42" cy="38" rx="32" ry="30" fill="#f2c06b"/>
    <ellipse cx="42" cy="50" rx="16" ry="12" fill="#fbe3b5"/>
    <circle class="eye" cx="30" cy="32" r="3.5"/>
    <circle class="eye" cx="54" cy="32" r="3.5"/>
    <circle cx="31" cy="31" r="1.2" fill="#fff"/>
    <circle cx="55" cy="31" r="1.2" fill="#fff"/>
    <ellipse class="nose" cx="42" cy="46" rx="5.5" ry="4"/>
    <path class="thin" d="M42 50 v4 M42 54 q-6 5 -11 0 M42 54 q6 5 11 0"/>
    <path class="o" d="M38 58 q4 10 8 0 z" fill="#ef6f6c"/>
  </g>

  <!-- Beagle with a collar, right -->
  <g transform="translate(170 86)" opacity="0.95">
    <ellipse class="o" cx="6" cy="40" rx="11" ry="24" fill="#6d4c41"/>
    <ellipse class="o" cx="68" cy="40" rx="11" ry="24" fill="#6d4c41"/>
    <ellipse class="o" cx="37" cy="34" rx="30" ry="28" fill="#fafafa"/>
    <path d="M16 14 q21 -16 42 0 q-8 12 -21 12 q-13 0 -21 -12 z" fill="#a1887f"/>
    <circle class="eye" cx="26" cy="30" r="3.5"/>
    <circle class="eye" cx="48" cy="30" r="3.5"/>
    <circle cx="27" cy="29" r="1.2" fill="#fff"/>
    <circle cx="49" cy="29" r="1.2" fill="#fff"/>
    <ellipse class="nose" cx="37" cy="42" rx="5.5" ry="4"/>
    <path class="thin" d="M37 46 v4 M37 50 q-6 5 -11 0 M37 50 q6 5 11 0"/>
    <path class="o" d="M20 62 q17 8 34 0 v8 q-17 8 -34 0 z" fill="#e53935"/>
    <circle class="o" cx="37" cy="72" r="4" fill="#ffd54f"/>
  </g>

  <!-- Pug-ish face, bottom-left -->
  <g transform="translate(28 170)" opacity="0.95">
    <path class="o" d="M8 28 q-10 -20 10 -22 q8 10 6 24 z" fill="#5d4037"/>
    <path class="o" d="M78 28 q10 -20 -10 -22 q-8 10 -6 24 z" fill="#5d4037"/>
    <ellipse class="o" cx="43" cy="36" rx="34" ry="30" fill="#d7b48a"/>
    <ellipse class="o" cx="43" cy="44" rx="17" ry="14" fill="#5d4037"/>
    <circle class="eye" cx="29" cy="30" r="4.5"/>
    <circle class="eye" cx="57" cy="30" r="4.5"/>
    <circle cx="30.5" cy="28.5" r="1.6" fill="#fff"/>
    <circle cx="58.5" cy="28.5" r="1.6" fill="#fff"/>
    <ellipse cx="43" cy="40" rx="5" ry="3.5" fill="#212121"/>
    <path class="thin" d="M43 44 v4 M43 48 q-5 5 -10 0 M43 48 q5 5 10 0" stroke="#212121"/>
    <path class="o" d="M39 54 q4 8 8 0 z" fill="#ef6f6c"/>
  </g>

  <!-- Bone -->
  <g transform="translate(182 214) rotate(-28)" opacity="0.95">
    <rect class="o" x="0" y="6" width="44" height="12" rx="5" fill="#fff3e0"/>
    <circle class="o" cx="2" cy="6" r="7" fill="#fff3e0"/>
    <circle class="o" cx="2" cy="18" r="7" fill="#fff3e0"/>
    <circle class="o" cx="42" cy="6" r="7" fill="#fff3e0"/>
    <circle class="o" cx="42" cy="18" r="7" fill="#fff3e0"/>
    <rect x="6" y="8" width="32" height="8" rx="4" fill="#fff3e0"/>
  </g>

  <!-- Tennis ball -->
  <g transform="translate(236 24)" opacity="0.95">
    <circle class="o" cx="16" cy="16" r="15" fill="#cddc39"/>
    <path d="M4 8 q12 8 0 16 M28 8 q-12 8 0 16" fill="none" stroke="#fafafa" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Paw prints -->
  <g fill="#8d6e63" stroke="#4e342e" stroke-width="1.5" opacity="0.9">
    <g transform="translate(132 30) rotate(-15)">
      <ellipse cx="0" cy="8" rx="7" ry="6"/>
      <circle cx="-8" cy="-2" r="3"/><circle cx="-2.5" cy="-6" r="3"/><circle cx="3.5" cy="-6" r="3"/><circle cx="9" cy="-2" r="3"/>
    </g>
    <g transform="translate(152 62) rotate(-15)">
      <ellipse cx="0" cy="8" rx="7" ry="6"/>
      <circle cx="-8" cy="-2" r="3"/><circle cx="-2.5" cy="-6" r="3"/><circle cx="3.5" cy="-6" r="3"/><circle cx="9" cy="-2" r="3"/>
    </g>
    <g transform="translate(136 216) rotate(20)">
      <ellipse cx="0" cy="8" rx="7" ry="6"/>
      <circle cx="-8" cy="-2" r="3"/><circle cx="-2.5" cy="-6" r="3"/><circle cx="3.5" cy="-6" r="3"/><circle cx="9" cy="-2" r="3"/>
    </g>
  </g>
</svg>
