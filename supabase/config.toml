# =============================================================================
# Supabase Configuration
# =============================================================================

[project]
id = "your-project-id"
name = "sims"

# =============================================================================
# Edge Functions
# =============================================================================

# Send Email Function
# Called by other functions and the app to send transactional emails
[functions.send-email]
verify_jwt = true

# Daily Notifications Job (slug kept as due-date-reminder — the prod pg_cron job
# posts to this URL at 09:00 UTC). Covers due/overdue reminders, reservation
# reminders, maintenance reminders, and the admin low-stock / overdue digests.
# verify_jwt is false so the scheduler can call it, but the function itself
# requires either an `x-cron-secret: <CRON_SECRET>` header or
# `Authorization: Bearer <service role key>`. Unauthenticated calls get 401.
[functions.due-date-reminder]
verify_jwt = false

# Fetch Product Page Function
# CORS proxy for Smart Paste URL import — fetches product pages for spec extraction
[functions.fetch-product-page]
verify_jwt = true

# Admin Create User Function
# Mints real sign-in credentials via the service role. MUST run behind
# verify_jwt = true: the function trusts the gateway-verified JWT's `sub` to
# look up the caller's admin_users permission and does NOT re-verify the
# signature itself. Declared explicitly so this can never drift to false.
[functions.admin-create-user]
verify_jwt = true

# =============================================================================
# Scheduled Functions (Cron Jobs)
# =============================================================================
# The daily job is scheduled with pg_cron + pg_net INSIDE the database (not a
# CLI flag). See NOTIFICATION_SETUP.md for the cron.schedule() statement and
# the vault secret it reads.

# =============================================================================
# Environment Variables Required
# =============================================================================
# Set these in your Supabase dashboard under Project Settings > Edge Functions:
#
# RESEND_API_KEY     - Your Resend API key (get from resend.com)
# FROM_EMAIL         - The "from" email address (e.g., "SIMS <notifications@yourdomain.com>")
# CRON_SECRET        - Shared secret for invoking due-date-reminder (any long
#                      random string; send it as the x-cron-secret header from
#                      your cron scheduler)
# COMPANY_NAME       - Optional signature name for emails sent by the daily job
#                      (defaults to "SIMS")
#
# These are automatically available:
# SUPABASE_URL            - Your project URL
# SUPABASE_SERVICE_ROLE_KEY - Service role key for admin operations

# AI spec extraction (Phase 2): verify_jwt is the outer gate; the function
# additionally rejects the bare anon key via isTrustedCaller.
[functions.extract-specs]
verify_jwt = true
