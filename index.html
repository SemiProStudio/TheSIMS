<!doctype html>
<html lang="en" style="background-color: var(--shell-bg, #1a1d21)">
  <head>
    <meta charset="UTF-8" />
    <!-- Pre-React shell palette: defaults to the dark theme; the inline
         script below restores the ACTIVE theme's colors (persisted by
         ThemeContext as 'sims-shell-colors') before first paint, so
         light-theme users no longer get a dark flash. -->
    <style>
      :root {
        --shell-bg: #1a1d21;
        --shell-card: #2a2f36;
        --shell-text: #e2e6ea;
        --shell-primary: #5d8aa8;
        --shell-on-primary: #ffffff;
      }
    </style>
    <script>
      try {
        var shellColors = JSON.parse(localStorage.getItem('sims-shell-colors') || 'null');
        if (shellColors) {
          var rootStyle = document.documentElement.style;
          if (shellColors.bg) rootStyle.setProperty('--shell-bg', shellColors.bg);
          if (shellColors.card) rootStyle.setProperty('--shell-card', shellColors.card);
          if (shellColors.text) rootStyle.setProperty('--shell-text', shellColors.text);
          if (shellColors.primary) rootStyle.setProperty('--shell-primary', shellColors.primary);
          if (shellColors.onPrimary)
            rootStyle.setProperty('--shell-on-primary', shellColors.onPrimary);
        }
      } catch (e) {
        /* corrupted storage — keep dark defaults */
      }
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="SIMS - Studio Inventory Management System. Professional equipment tracking for production companies."
    />
    <meta name="theme-color" content="#1a1d21" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SIMS - Studio Inventory Management" />
    <meta
      property="og:description"
      content="Professional equipment tracking for production companies"
    />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SIMS - Studio Inventory Management" />
    <meta
      name="twitter:description"
      content="Professional equipment tracking for production companies"
    />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />

    <title>SIMS - Studio Inventory Management</title>

    <!-- Preload critical fonts if any -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body style="background-color: var(--shell-bg); margin: 0">
    <noscript>
      <div
        style="
          padding: 20px;
          text-align: center;
          font-family: system-ui, sans-serif;
          color: #e8ecf0;
        "
      >
        <h1>JavaScript Required</h1>
        <p>SIMS requires JavaScript to run. Please enable JavaScript in your browser settings.</p>
      </div>
    </noscript>
    <div id="root" style="background-color: var(--shell-bg); min-height: 100vh">
      <!-- Static login shell — pixel-matched to React's Login card.
           React.createRoot().render() replaces this seamlessly. -->
      <div
        style="
          min-height: 100vh;
          background: var(--shell-bg);
          display: flex;
          align-items: center;
          justify-content: center;
          font-family:
            system-ui,
            -apple-system,
            sans-serif;
        "
      >
        <div
          style="
            background: var(--shell-card);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 1px solid color-mix(in srgb, var(--shell-primary) 20%, transparent);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            padding: 32px;
            width: 100%;
            max-width: 400px;
          "
        >
          <div
            style="
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 12px;
              margin-bottom: 32px;
            "
          >
            <img
              src="/moe.png"
              alt=""
              width="56"
              height="56"
              style="border-radius: 12px; object-fit: cover"
            />
            <div>
              <div style="font-size: 24px; font-weight: 700; color: var(--shell-text); margin: 0">SIMS</div>
              <div style="font-size: 12px; color: color-mix(in srgb, var(--shell-text) 45%, transparent)">
                Studio Inventory Management System
              </div>
            </div>
          </div>
          <div style="margin-bottom: 16px">
            <div
              style="
                font-size: 11px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: color-mix(in srgb, var(--shell-text) 45%, transparent);
                margin-bottom: 6px;
              "
            >
              Email
            </div>
            <div
              style="
                height: 40px;
                background: color-mix(in srgb, var(--shell-primary) 12%, transparent);
                border: 1px solid color-mix(in srgb, var(--shell-primary) 20%, transparent);
                border-radius: 8px;
              "
            ></div>
          </div>
          <div style="margin-bottom: 24px">
            <div
              style="
                font-size: 11px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: color-mix(in srgb, var(--shell-text) 45%, transparent);
                margin-bottom: 6px;
              "
            >
              Password
            </div>
            <div
              style="
                height: 40px;
                background: color-mix(in srgb, var(--shell-primary) 12%, transparent);
                border: 1px solid color-mix(in srgb, var(--shell-primary) 20%, transparent);
                border-radius: 8px;
              "
            ></div>
          </div>
          <div
            style="
              height: 42px;
              background: var(--shell-primary);
              border-radius: 8px;
              display: flex;
              align-items: center;
              justify-content: center;
              color: var(--shell-on-primary);
              font-weight: 600;
              font-size: 14px;
            "
          >
            Sign In
          </div>
          <div
            style="
              text-align: center;
              color: color-mix(in srgb, var(--shell-text) 45%, transparent);
              font-size: 12px;
              margin-top: 24px;
            "
          >
            Contact admin for access
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
